[package]
name = "fsspec_fuse_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fsspec_fuse"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fsspec_fuse = { path = "./rust", version = "*" }
fsspec_rs = "0.2.1"
fsspec_sys = { version = "0.2.1", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[features]
default = ["capi"]
# Resolve URLs through the shared libfsspec; `direct` keeps a registry inside this extension.
capi = ["dep:fsspec_sys"]
direct = []

[profile.release]
panic = 'abort'
lto = true
